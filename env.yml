name: chonknoris
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.5
  - pytorch-cuda=12.4
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - jupyter
  - jupyterlab
  - pip
  - pip:
      - gpytorch
      - lightning
      - linear_operator
      - neuraloperator
      - fastgps
      - qmcpy
      - pykolesky>=0.1.6
      - devito
      - pillow
      - wandb
      - tqdm
      - h5py
